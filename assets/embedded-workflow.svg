<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">From source code to connected devices</title>
  <desc id="desc">An animated illustration of an embedded Linux workflow: C and C++ source code, Yocto image creation, Linux drivers, and connected Raspberry Pi and QEMU devices.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#142a3b"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#122e3a"/><stop offset="1" stop-color="#0a202b"/></linearGradient>
  </defs>
  <style>
    .packet{stroke-dasharray:14 130;animation:send 5s linear infinite}.led{animation:glow 5s ease-in-out infinite}.cursor{animation:glow 3s ease-in-out infinite}
    @keyframes send{to{stroke-dashoffset:-288}}@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.packet,.led,.cursor{animation:none}}
  </style>
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="36" y="47" fill="#ecf5f7" font-size="25" font-weight="700">From source to connected systems</text>
    <text x="36" y="76" fill="#91aebd" font-size="14">An embedded Linux workflow</text>
  </g>
  <g fill="none" stroke="#35596a" stroke-width="2"><path d="M278 202H340M578 202H640M878 202H940"/></g>
  <g fill="none" stroke="#8fe5c4" stroke-width="3" class="packet"><path d="M278 202H340M578 202H640M878 202H940"/></g>
  <g stroke="#305361"><rect x="36" y="110" width="242" height="194" rx="16" fill="#0a1724"/><rect x="340" y="110" width="238" height="194" rx="16" fill="url(#screen)"/><rect x="640" y="110" width="238" height="194" rx="16" fill="url(#screen)"/><rect x="940" y="110" width="224" height="194" rx="16" fill="url(#screen)"/></g>
  <g font-family="monospace" font-size="14">
    <circle cx="55" cy="131" r="3" fill="#d89887"/><circle cx="67" cy="131" r="3" fill="#d5b46d"/><circle cx="79" cy="131" r="3" fill="#8bd0b1"/>
    <text x="55" y="176" fill="#c59ef4">#include &lt;linux/module.h&gt;</text>
    <text x="55" y="205" fill="#91d5c2">static int __init</text>
    <text x="55" y="231" fill="#b5cbd7">driver_init(void) {</text>
    <text x="68" y="257" fill="#b5cbd7">return 0;</text><text x="55" y="283" fill="#b5cbd7">}</text><rect class="cursor" x="72" y="270" width="8" height="15" fill="#8fe5c4"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g fill="none" stroke="#87d4bc" stroke-width="2"><path d="m459 141 29 16-29 16-29-16zm-29 29 29 16 29-16m-58 13 29 16 29-16"/><rect x="735" y="144" width="48" height="46" rx="7"/><path d="M743 136v8m10-8v8m12-8v8m10-8v8M743 190v8m10-8v8m12-8v8m10-8v8M727 153h8m-8 12h8m-8 12h8m48-24h8m-8 12h8m-8 12h8"/><rect x="1021" y="142" width="62" height="45" rx="5"/><path d="M1052 187v11m-20 0h40"/></g>
    <g fill="#e9f4f5" font-size="20" font-weight="700"><text x="459" y="235">Yocto image</text><text x="759" y="235">Linux drivers</text><text x="1052" y="235">Connected</text></g>
    <g fill="#94b1bf" font-size="13"><text x="459" y="266">Layers · BitBake · rootfs</text><text x="759" y="266">Kernel · Hardware interfaces</text><text x="1052" y="266">Raspberry Pi · QEMU</text></g>
  </g>
  <g class="led" fill="#8fe5c4"><circle cx="554" cy="132" r="4"/><circle cx="854" cy="132" r="4"/><circle cx="1140" cy="132" r="4"/></g>
</svg>
